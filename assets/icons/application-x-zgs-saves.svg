<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!--
    Icône du type MIME application/x-zgs-saves (fichiers .zgs ; saves de jeux exportées par ludis).
    Nom de fichier = nom d'icône attendu par shared-mime-info pour ce type MIME
    ("/" du type MIME remplacé par "-").
    Forme : même silhouette de carton que application-x-zgp-game.svg et
    application-x-zgr-runner.svg (Mint-L-Blue, GPLv3), recolorée avec un dégradé vert
    pour se distinguer des deux autres (jaune->orange : jeux, orange->rouge : runners).
    Glyphe : disquette (Tabler Icons "device-floppy", licence MIT), blanche et plate,
    centrée sur la zone utile du carton comme dans application-x-zgr-runner.svg.

    LICENCE : ce fichier reprend un tracé GPLv3 (Mint-L-Blue), distribué sous GPLv3, PAS
    sous la licence MIT du reste du projet ludis. Voir packaging/debian/copyright.
  -->
  <defs>
    <linearGradient id="savesGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3DBE6F"/>
      <stop offset="0.24" stop-color="#3DBE6F"/>
      <stop offset="1"    stop-color="#1E8449"/>
    </linearGradient>
  </defs>

  <g transform="scale(2.5)">
