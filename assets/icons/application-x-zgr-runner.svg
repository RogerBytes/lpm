<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!--
    Icône du type MIME application/x-zgr-runner (fichiers .zgr ; runners packagés par lpm).
    Nom de fichier = nom d'icône attendu par shared-mime-info pour ce type MIME
    ("/" du type MIME remplacé par "-").
    Forme : même silhouette de carton "package-x-generic" que application-x-zgp-game.svg
    (reprise du thème Mint-L-Blue, dépôt public linuxmint/mint-l-icons, licence
    GPLv3), mais recolorée avec un dégradé orange->rouge distinct (au lieu du jaune->orange
    partagé par lpm.svg et .zgp) : à petite taille (16-24px, taille d'affichage courante
    dans Nemo en vue liste), une même teinte sur les 3 icônes les rendait difficiles à
    distinguer au premier coup d'oeil. Le runner (.zgr) est donc le seul des 3 à passer sur
    une teinte plus chaude/rouge.
    Glyphe : verre plein (Tabler Icons "glass-full", licence MIT), blanc et plat ;
    référence à Wine, plus logique ici (le "moteur d'exécution" Wine/Proton) que sur .zgp,
    qui reprend maintenant le glyphe paquet de lpm.svg. Centré sur la zone utile du carton
    (entre le pli du rabat et le bas du carton, centre à (60, 77.34) au lieu de (60, 60) ;
    voir la note détaillée dans application-x-zgp-game.svg).

    LICENCE : ce fichier reprend un tracé GPLv3 (Mint-L-Blue), distribué sous GPLv3, PAS
    sous la licence MIT du reste du projet lpm. Voir packaging/debian/copyright.
  -->
  <defs>
    <linearGradient id="runnerOrangeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F2841D"/>
      <stop offset="0.24" stop-color="#F2841D"/>
      <stop offset="1"    stop-color="#C0392B"/>
    </linearGradient>
  </defs>

  <g transform="scale(2.5)">
    <path d="m 9.01,8.5 29.498,0 c 1.722,0 2.497,-0.287 2.992,1 l 3.002,8 0,25.674 c 0,1.553 0.103,1.316 -1.62,1.316 l -37.765,0 c -1.722,0 -1.619,0.237 -1.619,-1.316 l 0,-25.674 3.002,-8 c 0.48,-1.26 0.789,-1 2.51,-1 z"
          fill="url(#runnerOrangeRed)" stroke="#000000" stroke-opacity="0.4" stroke-width="0.14"/>
    <path d="m 22,8 4,0 0,14 C 25.606,22 25.213,21.229 24.819,21.229 24.416,21.229 24.013,22 23.609,22 23.285,22 22.96,21.325 22.636,21.325 22.424,21.325 22.212,22 22,22 L 22,8 Z"
          fill="#000000" fill-opacity="0.18"/>
    <path d="M4.5,17.5 L43.5,17.5" stroke="#000000" stroke-opacity="0.22" stroke-width="0.14"/>
  </g>

  <g transform="translate(33,53.34) scale(2.250)" fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 21l8 0" />
    <path d="M12 15l0 6" />
    <path d="M17 3l1 7c0 3.012 -2.686 5 -6 5s-6 -1.988 -6 -5l1 -7h10" />
    <path d="M6 10a5 5 0 0 1 6 0a5 5 0 0 0 6 0" />
  </g>
</svg>
